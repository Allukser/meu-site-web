<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Leads</title>
<style>
  :root {
    --sage:    #3d6b57;
    --sage-lt: #5e8070;
    --sage-bg: #eaf2ee;
    --sand:    #faf8f5;
    --warm:    #4a3f35;
    --warm-lt: #8c7b6e;
    --border:  #e2ddd8;
    --red:     #c0392b;
    --amber:   #d4871a;
    --green:   #2e7d52;
    --radius:  10px;
    --shadow:  0 2px 12px rgba(0,0,0,.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--sand); color: var(--warm); font-size: 14px; }
  a { color: var(--sage); }

  /* ── Header ── */
  .topbar { background: var(--sage); color: #fff; padding: .9rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
  .topbar h1 { font-size: 1rem; font-weight: 500; }
  .topbar .subtitle { font-size: .78rem; opacity: .7; }
  .topbar-right { margin-left: auto; display: flex; gap: .75rem; }
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1rem; border-radius: 6px; font-size: .82rem; font-weight: 500; cursor: pointer; border: none; transition: .2s; }
  .btn-outline { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); }
  .btn-outline:hover { background: rgba(255,255,255,.22); }
  .btn-primary { background: #fff; color: var(--sage); }
  .btn-primary:hover { background: var(--sage-bg); }

  /* ── Stats ── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; padding: 1.25rem 1.5rem; }
  .stat-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.25rem; box-shadow: var(--shadow); }
  .stat-card .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--warm-lt); margin-bottom: .4rem; }
  .stat-card .value { font-size: 1.9rem; font-weight: 600; color: var(--warm); line-height: 1; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.amber { color: var(--amber); }
  .stat-card .sub { font-size: .72rem; color: var(--warm-lt); margin-top: .35rem; }

  /* ── Filters ── */
  .filters { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; padding: 0 1.5rem .75rem; }
  .filters input, .filters select {
    border: 1px solid var(--border); border-radius: 6px; padding: .45rem .85rem;
    font-size: .83rem; background: #fff; color: var(--warm); outline: none;
  }
  .filters input:focus, .filters select:focus { border-color: var(--sage-lt); }
  .filters input { width: 240px; }
  .filter-count { margin-left: auto; font-size: .78rem; color: var(--warm-lt); }

  /* ── Table ── */
  .table-wrap { padding: 0 1.5rem 2rem; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
  th { background: var(--sage-bg); color: var(--sage); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; padding: .75rem 1rem; text-align: left; white-space: nowrap; }
  td { padding: .7rem 1rem; border-top: 1px solid var(--border); font-size: .83rem; vertical-align: middle; }
  tr:hover td { background: #fdfcfb; }

  .badge { display: inline-flex; align-items: center; padding: .2rem .65rem; border-radius: 20px; font-size: .72rem; font-weight: 500; }
  .badge-lead      { background: #e8f0fe; color: #1967d2; }
  .badge-agendado  { background: #fef3c7; color: #92400e; }
  .badge-convertido{ background: #d1fae5; color: #065f46; }
  .badge-perdido   { background: #fee2e2; color: #991b1b; }

  .gclid-cell { font-family: monospace; font-size: .72rem; color: var(--warm-lt); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fonte-cell { font-size: .75rem; background: var(--sage-bg); color: var(--sage); padding: .15rem .5rem; border-radius: 4px; }
  .btn-edit { background: none; border: 1px solid var(--border); border-radius: 5px; padding: .3rem .65rem; font-size: .75rem; cursor: pointer; color: var(--sage); transition: .15s; }
  .btn-edit:hover { background: var(--sage-bg); border-color: var(--sage-lt); }

  .empty { text-align: center; padding: 3rem; color: var(--warm-lt); }

  /* ── Modal ── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 420px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
  .modal-header { background: var(--sage); color: #fff; padding: 1.1rem 1.4rem; display: flex; justify-content: space-between; align-items: center; }
  .modal-header h2 { font-size: .95rem; font-weight: 500; }
  .modal-close { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; opacity: .7; }
  .modal-close:hover { opacity: 1; }
  .modal-body { padding: 1.4rem; display: flex; flex-direction: column; gap: 1rem; }
  .field label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--warm-lt); margin-bottom: .35rem; }
  .field input, .field select { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: .55rem .85rem; font-size: .88rem; color: var(--warm); outline: none; }
  .field input:focus, .field select:focus { border-color: var(--sage-lt); }
  .modal-info { font-size: .75rem; color: var(--warm-lt); background: var(--sage-bg); padding: .65rem .9rem; border-radius: 6px; line-height: 1.6; }
  .modal-footer { padding: 1rem 1.4rem; border-top: 1px solid var(--border); display: flex; gap: .75rem; justify-content: flex-end; }
  .btn-save { background: var(--sage); color: #fff; padding: .6rem 1.4rem; border-radius: 6px; font-size: .88rem; cursor: pointer; border: none; }
  .btn-save:hover { background: var(--sage-lt); }
  .btn-cancel { background: none; border: 1px solid var(--border); color: var(--warm-lt); padding: .6rem 1.1rem; border-radius: 6px; font-size: .88rem; cursor: pointer; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--sage); color: #fff; padding: .75rem 1.25rem; border-radius: 8px; font-size: .85rem; box-shadow: 0 4px 16px rgba(0,0,0,.2); transform: translateY(80px); opacity: 0; transition: .3s; z-index: 200; }
  .toast.show { transform: none; opacity: 1; }

  /* ── Loading ── */
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading { display: flex; align-items: center; justify-content: center; padding: 4rem; gap: 1rem; color: var(--warm-lt); }

  @media (max-width: 600px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .filters input { width: 100%; }
    .topbar-right .btn span { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Dashboard de Leads</h1>
    <div class="subtitle">Roangela Rocha · Psicóloga</div>
  </div>
  <div class="topbar-right">
    <button class="btn btn-outline" onclick="loadData()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      <span>Atualizar</span>
    </button>
    <button class="btn btn-primary" onclick="exportAds()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Export Google Ads</span>
    </button>
  </div>
</div>

<!-- KPIs -->
<div class="stats" id="stats">
  <div class="stat-card"><div class="label">Total de Leads</div><div class="value" id="s-total">—</div></div>
  <div class="stat-card"><div class="label">Agendados</div><div class="value amber" id="s-agendados">—</div></div>
  <div class="stat-card"><div class="label">Convertidos</div><div class="value green" id="s-convertidos">—</div></div>
  <div class="stat-card"><div class="label">Taxa de Conversão</div><div class="value green" id="s-taxa">—</div><div class="sub">leads → consultas</div></div>
  <div class="stat-card"><div class="label">Receita Estimada</div><div class="value" id="s-receita">—</div></div>
</div>

<!-- Filters -->
<div class="filters">
  <input type="text" id="search" placeholder="🔍  Buscar por nome, GCLID, fonte…" oninput="renderTable()">
  <select id="filter-status" onchange="renderTable()">
    <option value="">Todos os status</option>
    <option value="lead">Lead</option>
    <option value="agendado">Agendado</option>
    <option value="convertido">Convertido</option>
    <option value="perdido">Perdido</option>
  </select>
  <select id="filter-fonte" onchange="renderTable()">
    <option value="">Todas as fontes</option>
    <option value="inicio">Hero</option>
    <option value="header">Navbar</option>
    <option value="agendar">CTA Final</option>
    <option value="footer">Footer</option>
    <option value="float">Botão flutuante</option>
    <option value="page_view">Passivo</option>
  </select>
  <span class="filter-count" id="count"></span>
</div>

<!-- Table -->
<div class="table-wrap">
  <div id="loading"><div class="spinner" style="border-color:rgba(93,128,112,.2);border-top-color:var(--sage)"></div> Carregando leads…</div>
  <table id="leads-table" style="display:none">
    <thead>
      <tr>
        <th>Nome / Telefone</th>
        <th>Status</th>
        <th>Fonte</th>
        <th>Data do Clique</th>
        <th>GCLID</th>
        <th>Valor</th>
        <th>Convertido em</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">Nenhum lead encontrado com esses filtros.</div>
</div>

<!-- Modal de edição -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Editar Lead</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="modal-info"></div>
      <div class="field">
        <label>Nome da Paciente</label>
        <input type="text" id="f-nome" placeholder="Ex: Maria Silva">
      </div>
      <div class="field">
        <label>Telefone</label>
        <input type="tel" id="f-tel" placeholder="Ex: 11 99999-9999">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          <option value="lead">Lead</option>
          <option value="agendado">Agendado</option>
          <option value="convertido">Convertido</option>
          <option value="perdido">Perdido</option>
        </select>
      </div>
      <div class="field">
        <label>Valor da Consulta (R$)</label>
        <input type="number" id="f-valor" placeholder="Ex: 300" min="0">
      </div>
      <div class="field" id="field-conv-time">
        <label>Data/hora da Conversão</label>
        <input type="datetime-local" id="f-conv-time">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveModal()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var _allLeads   = [];
var _editingUuid = null;

/* ── Inicialização ── */
window.onload = loadData;

function loadData() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('leads-table').style.display = 'none';
  document.getElementById('empty').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(data) {
      _allLeads = data.leads || [];
      updateStats(data.stats || {});
      renderTable();
      document.getElementById('loading').style.display = 'none';
    })
    .withFailureHandler(function(err) {
      document.getElementById('loading').innerHTML = '⚠️ Erro ao carregar: ' + err.message;
    })
    .getLeadsData();
}

/* ── KPIs ── */
function updateStats(s) {
  document.getElementById('s-total').textContent      = s.total       || 0;
  document.getElementById('s-agendados').textContent  = s.agendados   || 0;
  document.getElementById('s-convertidos').textContent= s.convertidos || 0;
  document.getElementById('s-taxa').textContent       = (s.taxa || 0) + '%';
  document.getElementById('s-receita').textContent    =
    'R$ ' + ((s.receita || 0).toLocaleString('pt-BR', {minimumFractionDigits:2}));
}

/* ── Tabela ── */
function renderTable() {
  var search = document.getElementById('search').value.toLowerCase();
  var fStatus = document.getElementById('filter-status').value;
  var fFonte  = document.getElementById('filter-fonte').value;

  var filtered = _allLeads.filter(function(l) {
    if (fStatus && l['Status'] !== fStatus) return false;
    if (fFonte  && l['Fonte']  !== fFonte)  return false;
    if (search) {
      var hay = [l['Nome'],l['Telefone'],l['GCLID'],l['Fonte'],l['Página']].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('count').textContent = filtered.length + ' de ' + _allLeads.length + ' leads';

  var tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    document.getElementById('leads-table').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('leads-table').style.display = 'table';
  document.getElementById('empty').style.display = 'none';

  tbody.innerHTML = filtered.map(function(l) {
    var clique = l['Clicou WA em'] ? new Date(l['Clicou WA em']).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—';
    var conv   = l['Convertido em'] ? new Date(l['Convertido em']).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—';
    var valor  = l['Valor (R$)'] ? 'R$ ' + parseFloat(l['Valor (R$)']).toLocaleString('pt-BR',{minimumFractionDigits:2}) : '—';
    var badge  = '<span class="badge badge-' + (l['Status']||'lead') + '">' + (l['Status']||'lead') + '</span>';
    var nome   = l['Nome'] || '<em style="color:var(--warm-lt)">não informado</em>';
    var tel    = l['Telefone'] ? '<br><small style="color:var(--warm-lt)">' + l['Telefone'] + '</small>' : '';

    return '<tr>' +
      '<td>' + nome + tel + '</td>' +
      '<td>' + badge + '</td>' +
      '<td><span class="fonte-cell">' + (l['Fonte']||'?') + '</span></td>' +
      '<td>' + clique + '</td>' +
      '<td><span class="gclid-cell" title="' + (l['GCLID']||'') + '">' + (l['GCLID']||'—') + '</span></td>' +
      '<td>' + valor + '</td>' +
      '<td>' + conv + '</td>' +
      '<td><button class="btn-edit" onclick="openModal(\'' + l['UUID'] + '\')">Editar</button></td>' +
    '</tr>';
  }).join('');
}

/* ── Modal ── */
function openModal(uuid) {
  var l = _allLeads.find(function(x) { return x['UUID'] === uuid; });
  if (!l) return;
  _editingUuid = uuid;

  document.getElementById('modal-info').innerHTML =
    '<b>GCLID:</b> ' + (l['GCLID']||'—') + '<br>' +
    '<b>Fonte:</b> ' + (l['Fonte']||'—') + '  ·  ' +
    '<b>Página:</b> ' + (l['Página']||'/') + '<br>' +
    '<b>Clique:</b> ' + (l['Clicou WA em'] ? new Date(l['Clicou WA em']).toLocaleString('pt-BR') : '—');

  document.getElementById('f-nome').value   = l['Nome']      || '';
  document.getElementById('f-tel').value    = l['Telefone']  || '';
  document.getElementById('f-status').value = l['Status']    || 'lead';
  document.getElementById('f-valor').value  = l['Valor (R$)']|| '';

  var convTime = l['Convertido em'] ? new Date(l['Convertido em']) : null;
  document.getElementById('f-conv-time').value = convTime
    ? convTime.toISOString().slice(0,16) : '';

  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  _editingUuid = null;
}

function saveModal() {
  if (!_editingUuid) return;
  var btn = document.querySelector('.btn-save');
  btn.textContent = 'Salvando…';
  btn.disabled = true;

  var convTimeVal = document.getElementById('f-conv-time').value;
  var payload = {
    uuid:          _editingUuid,
    'Nome':        document.getElementById('f-nome').value,
    'Telefone':    document.getElementById('f-tel').value,
    'Status':      document.getElementById('f-status').value,
    'Valor (R$)':  document.getElementById('f-valor').value,
    'Convertido em': convTimeVal ? new Date(convTimeVal).toISOString() : ''
  };

  google.script.run
    .withSuccessHandler(function() {
      // Atualiza localmente
      var idx = _allLeads.findIndex(function(x) { return x['UUID'] === _editingUuid; });
      if (idx >= 0) Object.assign(_allLeads[idx], payload);
      document.getElementById('overlay').classList.remove('open');
      renderTable();
      toast('Lead atualizado com sucesso ✓');
      btn.textContent = 'Salvar';
      btn.disabled = false;
    })
    .withFailureHandler(function(err) {
      toast('Erro: ' + err.message, true);
      btn.textContent = 'Salvar';
      btn.disabled = false;
    })
    .updateLeadData(payload);
}

/* ── Export Google Ads ── */
function exportAds() {
  var url = google.script.getScriptUrl ? google.script.getScriptUrl() : null;
  // Abre a URL de export do CSV
  var scriptUrl = window.location.href.split('?')[0];
  window.open(scriptUrl + '?action=export_ads', '_blank');
  toast('CSV para Google Ads gerado — importe em Conversões → Uploads');
}

/* ── Toast ── */
function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isError ? '#c0392b' : 'var(--sage)';
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 3500);
}
</script>
</body>
</html>

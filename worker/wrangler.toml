name            = "roangela-gclid"
main            = "index.js"
compatibility_date = "2024-09-23"

# KV namespace para armazenar os leads com GCLID
# Crie com: npx wrangler kv namespace create "GCLID_KV"
# e cole o id retornado abaixo
[[kv_namespaces]]
binding = "GCLID_KV"
id      = "9979552f4a1c4113a1e868353719a103"

# Variáveis de ambiente
[vars]
ALLOWED_ORIGIN   = "https://roangela-psicologa.com.br"
# URL do Google Apps Script Web App (preencher após deploy do Apps Script)
APPS_SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbxX46q6VVJVFcGwUbZ6K6DPPZ2368qaO1d5_8tp4VyX1vJEei5Md61Ul36QIyLx1Rlq/exec"
